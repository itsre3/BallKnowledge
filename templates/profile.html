{% extends "layout.html" %}

{% block main %}

<div class="container py-5 d-flex justify-content-center">
  <div class="card bg-dark text-light border-secondary shadow-lg" style="width: 24rem; border-radius: 15px;">
    <div class="card-body text-center p-4">
      <div class="position-relative d-inline-block mb-3">
        <img src="{{ url_for('static', filename='images/profileD.jpeg')}}"
             class="rounded-circle border border-3 border-primary img-fluid shadow"
             style="width: 120px; height: 120px; object-fit: cover;"
             alt="Gamer Avatar">
        <span class="position-absolute bottom-0 end-0 bg-success border border-2 border-dark rounded-circle p-2" title="Online"></span>
      </div>
      <h3 class="fw-bold mb-1 tracking-wide"><span class="badge text-bg-dark border border-secondary px-2 py-1">{{ session.get("username") }}</span></h3>
      <p class="text-secondary small mb-3">{{ session.get("user_id") }}</p>
      <div class="my-3">
        <span class="badge bg-warning text-dark fs-6 px-3 py-2 border border-light border-opacity-25 rounded-pill shadow-sm">
          RANK
        </span>
      </div>
      <hr class="border-secondary my-3">
      <div class="d-grid gap-2">
        <button class="btn btn-outline-primary btn-sm fw-bold">Match History</button>
        <button class="btn btn-dark btn-sm text-secondary border-0">Settings</button>
      </div>
    </div>
  </div>
</div>

{% endblock %}
