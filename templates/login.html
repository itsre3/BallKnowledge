{% extends "layout.html" %}

{% block main %}
<div class="container py-5 justify-content-center">
    <form action="/login" method="post">
        <div class="form-group">
            <label for="email" aria-describedby="emailHelp">Email address</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="Enter email">
            <small id="emailHelp" class="form-text text-danger">{{ emailHelp }}</small>
        </div>
        <div class="form-group">
            <label for="password" aria-describedby="passwordHelp">Password</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="Password">
            <small id="passwordHelp" class="form-text text-danger">{{ passwordHelp }}</small>
        </div>
        <button type="submit" class="btn btn-primary">Log In</button>
    </form>
</div>
{% endblock %}
