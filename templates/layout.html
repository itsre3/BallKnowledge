<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BallKnowledge{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
        }
    </style>
</head>
<!-- Codes here were mistly got from bootstrap website: getbootstrap.com/docs -->
<body class="d-flex flex-column">
    <nav class="navbar navbar-expand-md navbar-dark px-3 py-2 border-bottom border-dark">
        <div class="container-fluid">
            <a class="navbar-brand fs-4 fw-bold tracking-tight text-white m-0" href="/">BallKnowledge</a>
            <div class="d-flex align-items-center gap-2 order-md-3">
                {% if session.get("username") %}
                <span class="badge text-bg-dark border border-secondary px-2 py-1">
                    <a class="nav-link" href="/profile">{{ session["username"] }}</a>
                </span>
                {% endif %}
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navCollapse">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>
            <div class="collapse navbar-collapse order-md-2" id="navCollapse">
                <ul class="navbar-nav me-auto mb-2 mb-md-0 ms-md-3 gap-md-2">
                    <li class="nav-item">
                        <a class="nav-link text-white-50" href="/play">Play</a>
                    </li>
                    {% if not session.get("user_id") %}
                        <li class="nav-item">
                            <a class="nav-link text-white-50" href="/register">Register</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white-50" href="/login">Login</a>
                        </li>
                    {% else %}
                        <li class="nav-item">
                            <a class="nav-link text-white-50" href="/profile">Profile</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white-50" href="/logout">Log Out</a>
                        </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>
    <main class="flex-grow-1 d-flex align-items-center justify-content-center p-3">
        <div class="w-100" style="max-width: 500px;">
            {% block main %}{% endblock %}
        </div>
    </main>
</body>
</html>
